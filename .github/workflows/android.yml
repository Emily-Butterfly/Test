name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.DOJOLOG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Optional: a stable signing key so new builds install over old ones (see README).
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DOJOLOG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dojolog-release.jks"
          echo "DOJOLOG_KEYSTORE_PATH=$RUNNER_TEMP/dojolog-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          DOJOLOG_KEYSTORE_PASSWORD: ${{ secrets.DOJOLOG_KEYSTORE_PASSWORD }}
          DOJOLOG_KEY_ALIAS: ${{ secrets.DOJOLOG_KEY_ALIAS }}
          DOJOLOG_KEY_PASSWORD: ${{ secrets.DOJOLOG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dojo-log-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
